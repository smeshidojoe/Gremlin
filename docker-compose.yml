services:
  gremlin:
    build: .
    container_name: gremlin
    restart: unless-stopped

    # .env берётся прямо из папки проекта — правки токенов не требуют пересборки
    env_file: .env

    # пути внутри контейнера ведут в примонтированную ./data,
    # поэтому база, сессия юзербота и медиа лежат у тебя на диске
    environment:
      DB_PATH: /app/data/gremlin.sqlite3
      LOG_PATH: /app/data/bot.log
      STATS_DB: /app/data/chat_stats.db
      TRIG_DIR: /app/data/triggers
      BACKUP_DIR: /app/data/backups
      TG_SESSION: /app/data/audit_session

    # чтобы контейнер видел локальную Ollama на хосте
    # (AI_BASE_URL=http://host.docker.internal:11434/v1). На Docker Desktop
    # это имя есть и так, строка нужна для докера на Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # порт веб-панели. Наружу его выводит туннель (ngrok/cloudflared),
    # публичный адрес кладётся в WEBAPP_URL. Без WEBAPP_URL панель не поднимается.
    ports:
      - "127.0.0.1:8081:8081"

    volumes:
      - ./.env:/app/.env:ro     # только чтение: контейнер его не меняет
      - ./data:/app/data        # база, сессия, медиа триггеров, логи

    # потолок памяти. memswap = mem_limit означает «свопа нет»:
    # иначе контейнер при утечке будет тихо свопиться вместо падения
    mem_limit: 4g
    memswap_limit: 4g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Туннель для панели. Отдельный контейнер, потому что переживает пересборку
  # бота: адрес панели тогда не меняется на каждый docker compose up, и кнопка
  # у поля ввода (её клиент Telegram кэширует) продолжает работать.
  #
  # Бот берёт адрес у него через служебный порт 2000 — за это отвечает
  # TUNNEL_METRICS в .env. Убрать эту переменную — и бот снова поднимет
  # cloudflared внутри себя, как раньше.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: gremlin-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://gremlin:8081
    depends_on:
      - gremlin

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
