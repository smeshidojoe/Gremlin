services:
  gremlin:
    build: .
    container_name: gremlin
    restart: unless-stopped

    # .env берётся прямо из папки проекта — правки токенов не требуют пересборки
    env_file: .env

    # пути внутри контейнера ведут в примонтированную ./data,
    # поэтому база, сессия юзербота и медиа лежат у тебя на диске
    environment:
      DB_PATH: /app/data/gremlin.sqlite3
      LOG_PATH: /app/data/bot.log
      STATS_DB: /app/data/chat_stats.db
      TRIG_DIR: /app/data/triggers
      BACKUP_DIR: /app/data/backups
      TG_SESSION: /app/data/audit_session
      # модель нейрофильтра монтируется, а не копируется в образ:
      # 240 МБ весов в каждой пересборке никому не нужны
      NN_MODEL_DIR: /app/models/rubert-tiny2

    # чтобы контейнер видел службы, поднятые на самом хосте (распознавалки,
    # локальные модели по HTTP). На Docker Desktop это имя есть и так,
    # строка нужна для докера на Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # порт веб-панели. Наружу его выводит туннель (ngrok/cloudflared),
    # публичный адрес кладётся в WEBAPP_URL. Без WEBAPP_URL панель не поднимается.
    ports:
      - "127.0.0.1:8081:8081"

    volumes:
      - ./.env:/app/.env:ro     # только чтение: контейнер его не меняет
      - ./data:/app/data        # база, сессия, медиа триггеров, логи
      - ./tools/models:/app/models:ro   # rubert-tiny2 для нейрофильтра

    # потолок памяти. memswap = mem_limit означает «свопа нет»:
    # иначе контейнер при утечке будет тихо свопиться вместо падения
    mem_limit: 4g
    memswap_limit: 4g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Расшифровка голосовых. Отдельный контейнер, потому что модель ест
  # процессор секундами: пока она считает, бот должен продолжать модерировать.
  # Внутри Vosk, но боту это безразлично — он знает только ручку
  # POST /transcribe, так что модель меняется без единой правки в боте.
  # Служба не поднята — бот работает как раньше, просто без расшифровок.
  #
  # Включается в .env:  ASR_URL=http://asr:8080/transcribe
  asr:
    build: ./asr
    container_name: gremlin-asr
    restart: unless-stopped

    environment:
      VOSK_MODEL: /models/vosk-model-small-ru-0.22

    volumes:
      - ./tools/models:/models:ro   # модель монтируется, в образ не копируется

    # маленькой русской модели хватает полугигабайта, большой нужно 3-4
    mem_limit: 4g
    memswap_limit: 4g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Туннель для панели. Отдельный контейнер, потому что переживает пересборку
  # бота: адрес панели тогда не меняется на каждый docker compose up, и кнопка
  # у поля ввода (её клиент Telegram кэширует) продолжает работать.
  #
  # Бот берёт адрес у него через служебный порт 2000 — за это отвечает
  # TUNNEL_METRICS в .env. Убрать эту переменную — и бот снова поднимет
  # cloudflared внутри себя, как раньше.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: gremlin-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://gremlin:8081
    depends_on:
      - gremlin

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
