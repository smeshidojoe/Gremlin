<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gremlin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #fff);
    --text: var(--tg-theme-text-color, #000);
    --hint: var(--tg-theme-hint-color, #888);
    --card: var(--tg-theme-secondary-bg-color, #f1f1f1);
    --btn: var(--tg-theme-button-color, #2ea6ff);
    --btn-text: var(--tg-theme-button-text-color, #fff);
    --link: var(--tg-theme-link-color, #2ea6ff);
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  header{position:sticky;top:0;background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--card);display:flex;align-items:center;gap:10px;z-index:5}
  header .back{cursor:pointer;font-size:20px;visibility:hidden}
  header h1{font-size:17px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  main{padding:12px 16px 40px}
  .card{background:var(--card);border-radius:12px;padding:12px 14px;margin:10px 0}
  .card h2{font-size:15px;margin:0 0 4px}
  .intro{color:var(--hint);font-size:13px;margin:0 0 10px}
  .row{display:flex;align-items:center;gap:8px;margin:8px 0}
  .row .lbl{flex:1}
  .toggle{cursor:pointer;padding:6px 12px;border-radius:8px;border:none;background:var(--btn);color:var(--btn-text);font-size:14px}
  .toggle.off{background:#8888;color:var(--text)}
  .sel{display:flex;align-items:center;gap:6px}
  .sel button{cursor:pointer;width:34px;height:34px;border:none;border-radius:8px;background:var(--btn);color:var(--btn-text);font-size:16px}
  .sel .val{min-width:96px;text-align:center;font-weight:600}
  .chat-item,.list-item{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--card);border-radius:10px;margin:8px 0;cursor:pointer}
  .list-item{cursor:default}
  .list-item .x{cursor:pointer;color:#e4322b;font-weight:700}
  .add{cursor:pointer;color:var(--link);padding:8px 0;font-weight:600}
  .pill{padding:5px 10px;border-radius:8px;border:none;background:#8884;color:var(--text);cursor:pointer;font-size:13px;margin:3px}
  .pill.on{background:var(--btn);color:var(--btn-text)}
  .muted{color:var(--hint);font-size:13px}
  #err{position:fixed;bottom:12px;left:16px;right:16px;background:#e4322b;color:#fff;padding:10px 14px;border-radius:10px;display:none}
</style>
</head>
<body>
<header>
  <span class="back" id="back">‹</span>
  <h1 id="title">Gremlin</h1>
</header>
<main id="app"></main>
<div id="err"></div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const INIT = tg?.initData || "";
const app = document.getElementById("app");
const titleEl = document.getElementById("title");
const backEl = document.getElementById("back");
let curCid = null;

async function api(path, method="GET", body=null){
  const opt = {method, headers:{"X-Init-Data":INIT, "ngrok-skip-browser-warning":"1"}};
  if(body){ opt.headers["Content-Type"]="application/json"; opt.body=JSON.stringify(body); }
  const r = await fetch(path, opt);
  if(!r.ok){ showErr((await r.json().catch(()=>({error:r.status}))).error); throw new Error(r.status); }
  return r.json();
}
function showErr(m){ const e=document.getElementById("err"); e.textContent="Ошибка: "+m; e.style.display="block"; setTimeout(()=>e.style.display="none",2500); }
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstChild; }

// ---------- список чатов ----------
async function showChats(){
  curCid=null; backEl.style.visibility="hidden"; titleEl.textContent="Мои чаты";
  const chats = await api("/api/chats");
  app.innerHTML="";
  if(!chats.length){ app.appendChild(el(`<p class="muted">Нет чатов. Добавьте бота в чат админом.</p>`)); return; }
  chats.forEach(c=>{
    const it = el(`<div class="chat-item"><span class="lbl">💬 ${esc(c.title)}</span><span>›</span></div>`);
    it.onclick=()=>showChat(c.id);
    app.appendChild(it);
  });
}

function esc(s){ return String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m])); }

// ---------- настройки чата ----------
async function showChat(cid){
  curCid=cid; backEl.style.visibility="visible"; backEl.onclick=showChats;
  const d = await api("/api/settings?cid="+cid);
  titleEl.textContent = d.chat.title;
  app.innerHTML="";
  d.sections.forEach(sec=>app.appendChild(renderSection(cid, sec, d)));
}

function renderSection(cid, sec, d){
  const card = el(`<div class="card"><h2>${esc(sec.title)}</h2><p class="intro">${esc(sec.intro)}</p></div>`);
  sec.fields.forEach(f=>{
    if(!f.visible) return;
    card.appendChild(f.kind==="toggle" ? toggleRow(cid,f,sec) : selRow(cid,f,sec,d));
  });
  sec.widgets.forEach(w=>card.appendChild(widget(cid,w,d)));
  return card;
}

function label(f){
  if(f.kind==="toggle") return f.value ? "✅ Вкл" : "🚫 Выкл";
  if(f.value_labels) return f.value_labels[f.value] ?? f.value;
  if(f.fmt==="minutes") return fmtMin(f.value);
  if(f.fmt==="sec") return f.value+" сек";
  return f.value;
}
function fmtMin(m){ if(m<=0)return"навсегда"; if(m<60)return m+"м"; if(m<1440)return Math.floor(m/60)+"ч"; return Math.floor(m/1440)+"д"; }

function toggleRow(cid,f,sec){
  const row = el(`<div class="row"><span class="lbl">${esc(f.label)}</span></div>`);
  const btn = el(`<button class="toggle ${f.value?"":"off"}">${f.value?"Вкл":"Выкл"}</button>`);
  btn.onclick=async()=>{ await api("/api/set","POST",{cid,field:f.key,value:f.value?0:1}); showChat(cid); };
  row.appendChild(btn); return row;
}
function selRow(cid,f,sec,d){
  const row = el(`<div class="row"><span class="lbl">${esc(f.label)}</span></div>`);
  const wrap = el(`<div class="sel"></div>`);
  const step=async(dir)=>{
    const i=f.values.indexOf(f.value); const ni=(i+dir+f.values.length)%f.values.length;
    await api("/api/set","POST",{cid,field:f.key,value:f.values[ni]}); showChat(cid);
  };
  const l=el(`<button>◀</button>`); l.onclick=()=>step(-1);
  const v=el(`<span class="val">${esc(label(f))}</span>`);
  const r=el(`<button>▶</button>`); r.onclick=()=>step(1);
  wrap.append(l,v,r); row.appendChild(wrap); return row;
}

// ---------- виджеты (списки) ----------
function widget(cid,w,d){
  const box=el(`<div></div>`);
  if(w==="cardbits"){
    box.appendChild(el(`<div class="muted">Какие события слать:</div>`));
    d.card_bits.forEach(cb=>{
      const p=el(`<button class="pill ${cb.on?"on":""}">${cb.on?"✅":"🚫"} ${esc(cb.label)}</button>`);
      p.onclick=async()=>{ await api("/api/cardbit","POST",{cid,bit:cb.bit}); showChat(cid); };
      box.appendChild(p);
    });
  } else if(w==="logsel"){
    const cur = d.log_chat_id ? String(d.log_chat_id) : "не задан";
    box.appendChild(el(`<div class="row"><span class="lbl">📍 Лог-чат: <b>${esc(cur)}</b></span></div>`));
    const sel=el(`<div></div>`);
    d.log_candidates.forEach(c=>{
      const on = String(c.id)===String(d.log_chat_id);
      const p=el(`<button class="pill ${on?"on":""}">${esc(c.title)}</button>`);
      p.onclick=async()=>{ await api("/api/log","POST",{cid,log_chat_id:c.id}); showChat(cid); };
      sel.appendChild(p);
    });
    const off=el(`<button class="pill">🚫 убрать</button>`);
    off.onclick=async()=>{ await api("/api/log","POST",{cid,log_chat_id:0}); showChat(cid); };
    sel.appendChild(off); box.appendChild(sel);
  } else if(w==="words"){
    const add=el(`<div class="add">➕ Добавить слова</div>`);
    add.onclick=async()=>{ const t=prompt("Слова через запятую. слово* — с окончаниями"); if(t){ await api("/api/words/add","POST",{cid,text:t}); showChat(cid);} };
    box.appendChild(add);
    d.words.forEach(r=>{
      const it=el(`<div class="list-item"><span class="lbl">${esc(r.word)}${r.mode==="stem"?"*":""}</span><span class="x">✕</span></div>`);
      it.querySelector(".x").onclick=async()=>{ await api("/api/words/del","POST",{cid,id:r.id}); showChat(cid); };
      box.appendChild(it);
    });
  } else if(w==="wl"){
    const add=el(`<div class="add">➕ Добавить в вайтлист</div>`);
    add.onclick=async()=>{
      const target=prompt("id или @username"); if(!target)return;
      const scope=prompt("Уровень: "+d.scopes.map(s=>s.key).join(" / "),"all"); if(!scope)return;
      await api("/api/wl/add","POST",{cid,target,scope}); showChat(cid);
    };
    box.appendChild(add);
    d.wl.forEach(r=>{
      const it=el(`<div class="list-item"><span class="lbl">${esc(r.who)} · ${esc(r.scope_label)}</span><span class="x">✕</span></div>`);
      it.querySelector(".x").onclick=async()=>{ await api("/api/wl/del","POST",{cid,id:r.id}); showChat(cid); };
      box.appendChild(it);
    });
  } else if(w==="anon"){
    const add=el(`<div class="add">➕ Разрешить отправителя (id)</div>`);
    add.onclick=async()=>{ const sid=prompt("Числовой id канала/группы"); if(sid){ await api("/api/anon/add","POST",{cid,sender_id:sid}); showChat(cid);} };
    box.appendChild(add);
    d.anon.forEach(r=>{
      const it=el(`<div class="list-item"><span class="lbl">${esc(r.title)}</span><span class="x">✕</span></div>`);
      it.querySelector(".x").onclick=async()=>{ await api("/api/anon/del","POST",{cid,id:r.id}); showChat(cid); };
      box.appendChild(it);
    });
  }
  return box;
}

showChats().catch(e=>showErr("не удалось загрузить"));
</script>
</body>
</html>
