[pytest]
# Асинхронные тесты без пометки на каждом: бот целиком на asyncio.
asyncio_mode = auto
# Своя петля на каждый тест: соединение aiosqlite привязано к петле, в которой
# открыто, и общая на сессию петля путала бы базы соседних тестов.
asyncio_default_fixture_loop_scope = function
testpaths = .
addopts = -q
markers =
    model: нужна настоящая модель rubert-tiny2 из tools/models (иначе пропуск)
